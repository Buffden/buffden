name: GitHub Arcade Contribution Graphs

on:
  schedule:
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # Generates all game SVGs into dist/:
      #   pacman-contribution-graph.svg / pacman-contribution-graph-dark.svg
      #   breakout-contribution-graph.svg / breakout-contribution-graph-dark.svg
      #   galaga-contribution-graph.svg / galaga-contribution-graph-dark.svg
      #   puzzle-bobble-contribution-graph.svg / puzzle-bobble-contribution-graph-dark.svg
      #   bomberman-contribution-graph.svg / bomberman-contribution-graph-dark.svg
      #   minesweeper-contribution-graph.svg / minesweeper-contribution-graph-dark.svg
      - name: Generate All Arcade Contribution Graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper"

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
